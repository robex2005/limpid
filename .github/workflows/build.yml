name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build test APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/limpid-test-${GITHUB_SHA::7}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: limpid-test-apk
          path: out/*.apk

      - name: Publish "nightly" pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --cleanup-tag -y || true
          gh release create nightly out/*.apk --prerelease --target "$GITHUB_SHA" \
            --title "Test build (${GITHUB_SHA::7})" \
            --notes "Automatic test build from the latest commit on main. Signed with a public test key: uninstall it before installing the F-Droid version."
